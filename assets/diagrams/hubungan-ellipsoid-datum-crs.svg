<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620">
<rect width="1400" height="620" fill="#ffffff"/>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#6d7f8a"/>
  </marker>
</defs>

<text x="700" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#173548">Dari Bumi Nyata ke Koordinat pada Peta</text>

<!-- Earth -->
<circle cx="130" cy="235" r="82" fill="#eaf3f7" stroke="#075175" stroke-width="4"/>
<path d="M48 235 Q130 270 212 235 M130 153 V317 M70 190 Q130 214 190 190 M70 280 Q130 256 190 280" fill="none" stroke="#8da4b0" stroke-width="2"/>
<text x="130" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#26323e">Bumi nyata</text>
<text x="130" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#667681">bentuk fisik bumi</text>

<!-- arrow1 -->
<line x1="230" y1="235" x2="315" y2="235" stroke="#6d7f8a" stroke-width="4" marker-end="url(#arrow)"/>

<!-- Ellipsoid -->
<ellipse cx="410" cy="235" rx="88" ry="68" fill="#f8fafb" stroke="#075175" stroke-width="4"/>
<text x="410" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#26323e">Ellipsoid</text>
<text x="410" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#667681">model matematis bumi</text>

<!-- Datum halo -->
<rect x="305" y="115" width="210" height="245" rx="18" fill="none" stroke="#b06b36" stroke-width="3" stroke-dasharray="10 7"/>
<text x="410" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9a5b2e">Datum geodetik</text>
<text x="410" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6d6259">kerangka acuan posisi</text>

<!-- arrow2 -->
<line x1="530" y1="235" x2="615" y2="235" stroke="#6d7f8a" stroke-width="4" marker-end="url(#arrow)"/>

<!-- Geographic CRS -->
<circle cx="710" cy="235" r="82" fill="#eef5f8" stroke="#075175" stroke-width="4"/>
<ellipse cx="710" cy="235" rx="82" ry="27" fill="none" stroke="#b06b36" stroke-width="2"/>
<line x1="710" y1="153" x2="710" y2="317" stroke="#8da4b0" stroke-width="2"/>
<path d="M642 185 Q710 215 778 185 M642 285 Q710 255 778 285" fill="none" stroke="#8da4b0" stroke-width="2"/>
<text x="710" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#26323e">Geographic CRS</text>
<text x="710" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#667681">latitude + longitude</text>
<text x="710" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#667681">unit: derajat</text>

<!-- Projection arrow -->
<line x1="805" y1="235" x2="935" y2="235" stroke="#b06b36" stroke-width="5" marker-end="url(#arrow)"/>
<text x="870" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9a5b2e">Proyeksi peta</text>
<text x="870" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6d6259">melengkung → datar</text>

<!-- Projected CRS -->
<rect x="975" y="145" width="190" height="180" rx="8" fill="#f8fafb" stroke="#075175" stroke-width="4"/>
<line x1="1010" y1="285" x2="1130" y2="285" stroke="#b06b36" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1010" y1="285" x2="1010" y2="180" stroke="#075175" stroke-width="4" marker-end="url(#arrow)"/>
<text x="1070" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#26323e">Projected CRS</text>
<text x="1070" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#667681">Easting + Northing</text>
<text x="1070" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#667681">unit: meter</text>

<!-- Example -->
<rect x="1185" y="155" width="180" height="160" rx="10" fill="#f6f8fa" stroke="#c3d0d7" stroke-width="2"/>
<text x="1275" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#26323e">Contoh</text>
<text x="1275" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#26323e">WGS 84</text>
<text x="1275" y="249" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#26323e">↓</text>
<text x="1275" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#26323e">Transverse Mercator</text>
<text x="1275" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#26323e">↓ UTM Zone 49S</text>

<!-- bottom explanation -->
<rect x="95" y="485" width="1170" height="92" rx="10" fill="#f6f8fa" stroke="#c3d0d7" stroke-width="2"/>
<text x="120" y="520" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#26323e">Hubungannya:</text>
<text x="120" y="551" font-family="Arial, sans-serif" font-size="16" fill="#26323e">Bumi dimodelkan dengan ellipsoid → datum memberi kerangka acuan → Geographic CRS menyatakan posisi → proyeksi peta meratakan → Projected CRS memberi koordinat datar.</text>
</svg>