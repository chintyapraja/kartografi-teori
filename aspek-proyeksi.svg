<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Ilustrasi aspek proyeksi normal, transversal, dan miring</title><desc id="desc">Ilustrasi aspek proyeksi normal, transversal, dan miring</desc>
<style>
  text{font-family:Inter,Arial,sans-serif;fill:#173042}.title{font-size:30px;font-weight:750}.label{font-size:22px;font-weight:700}.small{font-size:17px;fill:#536775}.tiny{font-size:14px;fill:#536775}.earth{fill:#e7f3f5;stroke:#23677a;stroke-width:3}.land{fill:#c9ddd0;stroke:#3b6754;stroke-width:1}.line{fill:none;stroke:#23677a;stroke-width:3}.guide{fill:none;stroke:#89aab3;stroke-width:2;stroke-dasharray:7 7}.accent{fill:#f1b44c;stroke:#9a6512;stroke-width:2}.paper{fill:#fff;stroke:#23677a;stroke-width:3}.soft{fill:#f5f7f4;stroke:#c8d4d8;stroke-width:2}.arrow{stroke:#d1643f;stroke-width:4;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d1643f"/></marker></defs>

<text x="600" y="43" text-anchor="middle" class="title">Posisi bidang terhadap sumbu bumi</text>
<g transform="translate(75 78)"><rect width="320" height="365" rx="18" class="soft"/><circle cx="160" cy="160" r="92" class="earth"/><path d="M160 50V270" class="guide"/><g transform="rotate(0 160 160)"><rect x="70" y="30" width="180" height="260" rx="8" class="guide"/><ellipse cx="160" cy="30" rx="90" ry="25" class="line"/><ellipse cx="160" cy="290" rx="90" ry="25" class="line"/></g><text x="160" y="320" text-anchor="middle" class="label">Normal</text><text x="160" y="347" text-anchor="middle" class="tiny">sumbu bidang sejajar sumbu bumi</text></g><g transform="translate(440 78)"><rect width="320" height="365" rx="18" class="soft"/><circle cx="160" cy="160" r="92" class="earth"/><path d="M160 50V270" class="guide"/><g transform="rotate(90 160 160)"><rect x="70" y="30" width="180" height="260" rx="8" class="guide"/><ellipse cx="160" cy="30" rx="90" ry="25" class="line"/><ellipse cx="160" cy="290" rx="90" ry="25" class="line"/></g><text x="160" y="320" text-anchor="middle" class="label">Transversal</text><text x="160" y="347" text-anchor="middle" class="tiny">bidang diputar sekitar 90°</text></g><g transform="translate(805 78)"><rect width="320" height="365" rx="18" class="soft"/><circle cx="160" cy="160" r="92" class="earth"/><path d="M160 50V270" class="guide"/><g transform="rotate(38 160 160)"><rect x="70" y="30" width="180" height="260" rx="8" class="guide"/><ellipse cx="160" cy="30" rx="90" ry="25" class="line"/><ellipse cx="160" cy="290" rx="90" ry="25" class="line"/></g><text x="160" y="320" text-anchor="middle" class="label">Miring</text><text x="160" y="347" text-anchor="middle" class="tiny">bidang berada pada sudut lain</text></g>
</svg>