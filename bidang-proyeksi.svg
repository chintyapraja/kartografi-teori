<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Ilustrasi bidang proyeksi silinder, kerucut, dan azimutal</title><desc id="desc">Ilustrasi bidang proyeksi silinder, kerucut, dan azimutal</desc>
<style>
  text{font-family:Inter,Arial,sans-serif;fill:#173042}.title{font-size:30px;font-weight:750}.label{font-size:22px;font-weight:700}.small{font-size:17px;fill:#536775}.tiny{font-size:14px;fill:#536775}.earth{fill:#e7f3f5;stroke:#23677a;stroke-width:3}.land{fill:#c9ddd0;stroke:#3b6754;stroke-width:1}.line{fill:none;stroke:#23677a;stroke-width:3}.guide{fill:none;stroke:#89aab3;stroke-width:2;stroke-dasharray:7 7}.accent{fill:#f1b44c;stroke:#9a6512;stroke-width:2}.paper{fill:#fff;stroke:#23677a;stroke-width:3}.soft{fill:#f5f7f4;stroke:#c8d4d8;stroke-width:2}.arrow{stroke:#d1643f;stroke-width:4;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d1643f"/></marker></defs>

<text x="600" y="45" text-anchor="middle" class="title">Tiga keluarga bidang proyeksi</text>
<g transform="translate(55 70)"><rect width="310" height="420" rx="18" class="soft"/><circle cx="150" cy="190" r="100" class="earth"/><rect x="42" y="70" width="216" height="240" rx="7" class="guide"/><ellipse cx="150" cy="70" rx="108" ry="30" class="line"/><ellipse cx="150" cy="310" rx="108" ry="30" class="line"/><text x="150" y="375" text-anchor="middle" class="label">Silinder</text><text x="150" y="405" text-anchor="middle" class="small">bidang membungkus globe</text></g><g transform="translate(445 70)"><rect width="310" height="420" rx="18" class="soft"/><circle cx="150" cy="215" r="100" class="earth"/><path d="M150 25L25 345H275Z" class="guide"/><ellipse cx="150" cy="345" rx="125" ry="32" class="line"/><path d="M104 143Q150 164 196 143" class="line"/><text x="150" y="375" text-anchor="middle" class="label">Kerucut</text><text x="150" y="405" text-anchor="middle" class="small">bidang berbentuk kerucut</text></g><g transform="translate(835 70)"><rect width="310" height="420" rx="18" class="soft"/><circle cx="150" cy="220" r="100" class="earth"/><path d="M5 115H295V52H5Z" class="paper"/><circle cx="150" cy="120" r="8" class="accent"/><path d="M150 120V320" class="guide"/><text x="150" y="375" text-anchor="middle" class="label">Azimutal</text><text x="150" y="405" text-anchor="middle" class="small">bidang menyentuh satu titik</text></g>
</svg>