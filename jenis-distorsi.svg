<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
<title id="title">Ilustrasi distorsi bentuk, luas, jarak, dan arah</title><desc id="desc">Ilustrasi distorsi bentuk, luas, jarak, dan arah</desc>
<style>
  text{font-family:Inter,Arial,sans-serif;fill:#173042}.title{font-size:30px;font-weight:750}.label{font-size:22px;font-weight:700}.small{font-size:17px;fill:#536775}.tiny{font-size:14px;fill:#536775}.earth{fill:#e7f3f5;stroke:#23677a;stroke-width:3}.land{fill:#c9ddd0;stroke:#3b6754;stroke-width:1}.line{fill:none;stroke:#23677a;stroke-width:3}.guide{fill:none;stroke:#89aab3;stroke-width:2;stroke-dasharray:7 7}.accent{fill:#f1b44c;stroke:#9a6512;stroke-width:2}.paper{fill:#fff;stroke:#23677a;stroke-width:3}.soft{fill:#f5f7f4;stroke:#c8d4d8;stroke-width:2}.arrow{stroke:#d1643f;stroke-width:4;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d1643f"/></marker></defs>

<text x="600" y="42" text-anchor="middle" class="title">Empat sifat yang dapat berubah</text>
<g transform="translate(45 76)"><rect width="255" height="380" rx="18" class="soft"/><circle cx="130" cy="150" r="62" class="accent"/><ellipse cx="130" cy="150" rx="95" ry="42" fill="none" stroke="#d1643f" stroke-width="4"/><text x="127" y="292" text-anchor="middle" class="label">Bentuk</text><foreignObject x="20" y="315" width="215" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px Inter,Arial,sans-serif;color:#536775;text-align:center;line-height:1.35">lingkaran dapat menjadi oval</div></foreignObject></g><g transform="translate(330 76)"><rect width="255" height="380" rx="18" class="soft"/><circle cx="105" cy="150" r="42" class="accent"/><circle cx="175" cy="150" r="76" fill="#f6d99e" stroke="#d1643f" stroke-width="4"/><text x="127" y="292" text-anchor="middle" class="label">Luas</text><foreignObject x="20" y="315" width="215" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px Inter,Arial,sans-serif;color:#536775;text-align:center;line-height:1.35">ukuran relatif dapat membesar</div></foreignObject></g><g transform="translate(615 76)"><rect width="255" height="380" rx="18" class="soft"/><circle cx="75" cy="150" r="9" class="accent"/><circle cx="190" cy="150" r="9" class="accent"/><path d="M84 150H181" class="line"/><path d="M75 215H220" stroke="#d1643f" stroke-width="4"/><path d="M75 205V225M220 205V225" stroke="#d1643f" stroke-width="4"/><text x="127" y="292" text-anchor="middle" class="label">Jarak</text><foreignObject x="20" y="315" width="215" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px Inter,Arial,sans-serif;color:#536775;text-align:center;line-height:1.35">skala dapat berbeda menurut lokasi</div></foreignObject></g><g transform="translate(900 76)"><rect width="255" height="380" rx="18" class="soft"/><path d="M55 205L205 92" class="line"/><path d="M55 205Q145 200 205 92" stroke="#d1643f" stroke-width="4" fill="none"/><circle cx="55" cy="205" r="8" class="accent"/><circle cx="205" cy="92" r="8" class="accent"/><text x="127" y="292" text-anchor="middle" class="label">Arah</text><foreignObject x="20" y="315" width="215" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px Inter,Arial,sans-serif;color:#536775;text-align:center;line-height:1.35">garis lurus tidak selalu rute terpendek</div></foreignObject></g>
</svg>